<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | MRH Solutions</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <!-- Self-contained so it renders correctly at any URL depth -->
  <style>
    :root { --ink: #0d1b2a; --text: #354357; --brand: #0f6e68; --bg: #fbfaf7; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 2rem 1rem; background: var(--bg); color: var(--text);
      font: 1.0625rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 32rem; }
    svg { width: 48px; height: 48px; margin: 0 auto 1.5rem; display: block; }
    h1 { margin: 0 0 0.5rem; color: var(--ink); font: 600 clamp(2rem, 6vw, 2.75rem)/1.1 ui-serif, Georgia, serif; letter-spacing: -0.02em; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 48px; margin-top: 1.5rem; padding: 0.75rem 1.375rem;
      border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; text-decoration: none;
    }
    a.btn:hover { background: #0a5751; }
    a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    p a { color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#0d1b2a"/>
      <path d="M16 12v3.5M16 15.5l-5.5 4.25M16 15.5l5.5 4.25" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="9.25" r="3" fill="#fff"/>
      <circle cx="9.75" cy="22.25" r="3" fill="#fff"/>
      <circle cx="22.25" cy="22.25" r="3" fill="#5fd0c2"/>
    </svg>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or has moved. You can head back to the homepage, or email <a href="mailto:matt@mrhsolutions.co">matt@mrhsolutions.co</a>.</p>
    <a class="btn" href="/">Back to MRH Solutions</a>
  </main>
</body>
</html>
